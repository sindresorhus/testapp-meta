# Trigger build 4
name: Appcast

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  call-workflow:
    uses: sindresorhus/appcast-workflow/.github/workflows/appcast.yml@e779465da800b68e1420ba9d0fbed8b17baa0ad9
    secrets: inherit
    permissions:
      pages: write
      id-token: write

